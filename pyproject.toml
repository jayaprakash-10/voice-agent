[project]
name = "voice-agent"
version = "0.1.0"
description = "Phone voice agent: Plivo + Pipecat (Deepgram STT, Groq LLM, Cartesia TTS) with a mock clinic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pipecat-ai[cartesia,deepgram,groq,silero,websocket]>=1.16.0",
    "plivo>=4.63.1",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "twilio>=9.13.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
voice-agent = "voice_agent.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
